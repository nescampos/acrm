# Configuración del sistema CRM Multi-Agente

# Configuración LLM
llm:
  provider: openai
  model: gpt-4o
  temperature: 0.7
  max_tokens: 2000

# Configuración de agentes
agents:
  sales:
    enabled: true
    auto_qualify_leads: true
    follow_up_interval_hours: 24
  
  support:
    enabled: true
    auto_classify_tickets: true
    escalation_threshold_minutes: 30
  
  marketing:
    enabled: true
    auto_segment: true
    campaign_frequency: weekly

# Configuración de logging
logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} - {message}"
  file: logs/app.log
  rotation: 10 MB
  retention: 30 days

# Configuración de base de datos (opcional)
database:
  enabled: false
  type: sqlite
  path: data/crm.db

# Configuración de API (si se expone REST)
api:
  enabled: false
  host: 0.0.0.0
  port: 8000
