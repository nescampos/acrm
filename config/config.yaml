# Configuración del sistema CRM Multi-Agente con Elastic

# Configuración Elastic Stack
elastic:
  host: http://localhost:9200
  user: elastic
  password: changeme
  verify_certs: false
  timeout: 30
  # Cloud alternative:
  # cloud_id: your_cloud_id
  # cloud_api_key: your_api_key

  # Índices CRM
  indices:
    customers: crm_customers
    tickets: crm_tickets
    interactions: crm_interactions
    campaigns: crm_campaigns

# Kibana - API Agent Builder (gestión de agentes y chat)
kibana:
  host: http://localhost:5601
  api_key: ""
  space: ""  # opcional, ej: default o my-space. Vacío = espacio por defecto

# Configuración LLM para Elastic Agent Builder
llm:
  provider: openai
  model: gpt-4o
  temperature: 0.7
  max_tokens: 2000

# Configuración de agentes
agents:
  # Agente de Ventas con Elastic
  sales:
    enabled: true
    type: elastic  # elastic o standard
    auto_qualify_leads: true
    follow_up_interval_hours: 24
    semantic_search: true
    rag_enabled: true

  # Agente de Soporte con Elastic
  support:
    enabled: true
    type: elastic
    auto_classify_tickets: true
    escalation_threshold_minutes: 30
    search_history: true

  # Agente de Marketing con Elastic
  marketing:
    enabled: true
    type: elastic
    auto_segment: true
    campaign_frequency: weekly
    engagement_analysis: true

# Configuración de logging
logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} - {message}"
  file: logs/app.log
  rotation: 10 MB
  retention: 30 days

# Configuración de API (si se expone REST)
api:
  enabled: false
  host: 0.0.0.0
  port: 8000
